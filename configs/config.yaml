# Crisis Assistant Configuration
version: "1.0"

# Large Language Model Settings
llm:
  # Backend options: mock, ollama, openai, anthropic
  backend: "mock"  # Start with mock for testing, then switch to preferred
  max_tokens: 150
  
  # Mock backend (for testing)
  mock_config:
    # No configuration needed
  
  # Ollama backend (local)
  ollama_config:
    base_url: "http://localhost:11434"
    model: "llama3.2:3b"  # or phi3, mistral, etc.
    temperature: 0.3
  
  # OpenAI backend (cloud)
  openai_config:
    model: "gpt-3.5-turbo"
    temperature: 0.3
    # api_key: "your-key-here"  # or set OPENAI_API_KEY env var
  
  # Anthropic backend (cloud)
  anthropic_config:
    model: "claude-3-haiku-20240307"
    temperature: 0.3
    # api_key: "your-key-here"  # or set ANTHROPIC_API_KEY env var

app:
  prompt_style: "conversational"   # conversational, warm, coach, plain - humanoid Alexa-like responses
  disclaimer: |
    This assistant is for educational guidance only and is NOT a substitute for professional medical care.
    If someone is in immediate danger, call your local emergency number now.

# Offline voice mode (push-to-talk)
voice:
  enabled: false
  mode: "push_to_talk"
  stt:
    backend: "whispercpp"
    whisper_bin: "/home/jane/tools/whisper.cpp/build/bin/whisper-cli"   # some installs name this `main`
    model_path: "models/whisper/ggml-tiny.en.bin"
    language: "en"
    sample_rate: 16000
    record_seconds: 6.0
  tts:
    backend: "piper"
    piper_bin: "/home/jane/tools/piper/piper/piper"
    # Set this to your Piper voice .onnx file, e.g. models/piper/en_US-amy-medium.onnx
    voice_model: "models/piper/en_US-hfc_female-medium.onnx"

rag:
  index_path: "data/index"
  embedding_model: "BAAI/bge-small-en-v1.5"   # fast on CPU (384-d). For higher quality: BAAI/bge-base-en-v1.5 (768-d)
  normalize_embeddings: true
  chunk_tokens: 150
  chunk_overlap_tokens: 20
  top_k: 3              # final results to return
  candidate_k: 20       # number to retrieve before reranking/fusion
  use_hybrid: true      # dense + BM25 with Reciprocal Rank Fusion
  vector_index: "hnsw"  # hnswlib for CPU-friendly ANN
  hnsw:
    M: 32
    ef_construction: 200
    ef_search: 128
  reranker:
    enabled: true
    model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    top_n: 5
  similarity_threshold: 0.45
decision:
  path: "decision_trees"
  priority_override: true  # Critical trees always override LLM

audio:
  enabled: false  # Set to true for voice mode

  whisper:
    model_path: "models/whisper/ggml-tiny.en.bin"
    binary_path: "whisper.cpp/main"
    language: "en"
    n_threads: 4

  piper:
    model_path: "models/piper/en_US-lessac-medium.onnx"
    binary_path: "piper"
    speed: 0.9

  microphone:
    sample_rate: 16000
    channels: 1
    record_duration: 5

  wake_word:
    enabled: false
    keyword: "hey crisis"

system:
  log_level: "INFO"
  log_file: "logs/crisis-assistant.log"
  offline_mode: true

safety:
  always_suggest_emergency_services: true
  disclaimer_on_start: true
  max_conversation_length: 20